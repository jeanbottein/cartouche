name: Release

on:
  push:
    tags: ['v*']
  # Build every artifact (AppImages included) from the Actions tab, without
  # tagging; the GitHub release itself is only created for v* tags.
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: cartouche-linux-x86_64
          - os: ubuntu-24.04-arm
            artifact: cartouche-linux-aarch64
          - os: macos-26-intel
            artifact: cartouche-darwin-x86_64
          - os: macos-latest
            artifact: cartouche-darwin-arm64
          - os: windows-latest
            artifact: cartouche-windows-x86_64

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      # Runtime libraries for the AppImage smoke test (the build itself runs
      # in the Debian 12 container, which has its own -dev packages).
      - name: Linux runtime libs
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libudev-dev libx11-dev libxi-dev libgl1-mesa-dev libasound2-dev

      - name: Build
        shell: bash
        env:
          # Embedded (obfuscated) as the default SteamGridDB key, see build.rs.
          STEAMGRIDDB_API_KEY: ${{ secrets.STEAMGRIDDB_API_KEY }}
          # Linux builds in the Containerfile's Debian 12 (glibc 2.36): a
          # binary built on the runner's Ubuntu would need its newer glibc.
          CARGO: ${{ runner.os == 'Linux' && './container.sh' || 'cargo' }}
        run: bash release.sh

      - name: Check the glibc floor
        if: runner.os == 'Linux'
        run: |
          need=$(objdump -T dist/${{ matrix.artifact }} | grep -o 'GLIBC_[0-9.]*' | sort -uV | tail -1)
          echo "Requires $need (max allowed GLIBC_2.36, Debian 12)"
          [ "$(printf '%s\n' "$need" GLIBC_2.36 | sort -V | tail -1)" = GLIBC_2.36 ]

      - name: AppImage
        if: runner.os == 'Linux'
        run: bash appimage.sh dist/${{ matrix.artifact }}

      - name: Smoke-test the AppImage
        if: runner.os == 'Linux'
        run: |
          APPIMAGE_EXTRACT_AND_RUN=1 dist/${{ matrix.artifact }}.AppImage --version

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: dist/*

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Collect binaries
        run: |
          mkdir -p release
          find artifacts -type f -exec cp {} release/ \;
          ls -la release/

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          files: release/*
          generate_release_notes: true
