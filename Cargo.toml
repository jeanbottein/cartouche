[package]
name = "cartouche"
version = "0.2.0"
edition = "2021"
description = "Manage DRM-free games on Linux / Steam Deck: detect, enrich, sync to Steam, patch, back up saves"
license = "MIT"

[dependencies]
macroquad = "0.4"
gilrs = { version = "0.10", optional = true }
serde = { version = "1", features = ["derive"] }
# preserve_order: JSON objects keep their key order, like the files we rewrite.
serde_json = { version = "1", features = ["preserve_order"] }
# Decode cover art ourselves: macroquad's loader only supports PNG and panics on
# JPEG. image 0.24 matches macroquad's transitive version.
image = { version = "0.24", default-features = false, features = ["png", "jpeg", "ico"] }
ureq = "2"
crc32fast = "1"
# Game packages are plain tar files (readable with `tar xf`, no Cartouche needed).
tar = { version = "0.4", default-features = false }
log = { version = "0.4", features = ["std"] }

[features]
default = ["gamepad"]
# Gamepad support via gilrs. Needs libudev (+ pkg-config) at build time on Linux.
# Disable (`--no-default-features`) to build keyboard/mouse-only on systems
# without those, e.g. an immutable SteamOS dev box.
gamepad = ["dep:gilrs"]

[profile.release]
opt-level = 3
lto = true
strip = true
